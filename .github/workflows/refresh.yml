name: Refresh KE_UPIA Dashboard

# Schedule disabled 2026-07-24 -- the actual refresh now runs from
# fourth-generation-capital-ltd/freshservice-reports (a paid, established org
# repo not subject to the new-repo abuse-review hold that stalled runs here)
# and pushes into this repo. This workflow is kept as a manual fallback only
# (workflow_dispatch) -- do not re-add the schedule, or both jobs will race
# to push to this same repo/branch. See project memory (2026-07-24 entry).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dashboard snapshot
        env:
          FS_API_KEY: ${{ secrets.FS_API_KEY }}
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to publish."
          fi
